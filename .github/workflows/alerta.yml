name: Alerta para Discord

on:
  push:


jobs:
  alerta:
    runs-on: ubuntu-latest


    steps:
      - name: Enviar mensagem para Discord
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d '{\"content": \"Novo push realizado no repositorio!\"}" \
          ${{ secrets.DISCORD_WEBHOOK }}
          